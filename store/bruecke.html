<!doctype html><meta charset="utf-8"><title>Brücke</title>
<script>
// Reicht Store-Bilder per postMessage an App Store Connect weiter (nur für den Upload).
window.addEventListener('message', async (e) => {
  if (e.origin !== 'https://appstoreconnect.apple.com') return;
  const r = await fetch(e.data.datei, {cache: 'no-store'});
  const b = await r.arrayBuffer();
  e.source.postMessage({datei: e.data.datei, daten: b}, e.origin, [b]);
});
if (window.opener) window.opener.postMessage('bereit', 'https://appstoreconnect.apple.com');
</script>
<p>Brücke für den Upload.</p>
