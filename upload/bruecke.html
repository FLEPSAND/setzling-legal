<!doctype html><script>
window.addEventListener('message', async e => {
  const {id, pfad, art} = e.data || {};
  if (!pfad) return;
  try {
    const r = await fetch(pfad);
    const daten = art === 'text' ? await r.text() : await r.arrayBuffer();
    e.source.postMessage({id, daten}, '*', art === 'text' ? [] : [daten]);
  } catch (f) { e.source.postMessage({id, fehler: String(f)}, '*'); }
});
parent.postMessage({bereit: true}, '*');
</script>
